# Nur mit eingeschalteter Conversion-Messung (Docker-Build mit --build-arg CSP=ads): erlaubt zusätzlich
# die Adressen des Google-Ads-Tags. Geladen werden sie trotzdem erst nach Zustimmung (src/assets/consent.js).
add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net; style-src 'self'; img-src 'self' https://www.googletagmanager.com https://googleads.g.doubleclick.net https://www.google.com https://www.google.at; connect-src 'self' https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.google.com https://www.google.at; frame-src https://td.doubleclick.net https://www.googletagmanager.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "browsing-topics=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
