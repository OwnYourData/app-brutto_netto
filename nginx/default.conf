# Statische Auslieferung des Brutto/Netto-Rechners.
# Kein Zugriffsprotokoll: Der Server merkt sich weder IP-Adressen noch aufgerufene Adressen.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    access_log off;
    log_not_found off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~* \.(css|js|svg|json)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
